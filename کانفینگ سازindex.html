<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ساخت کانفیگ ویتوری با حجم دلخواه</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
    </script>
    <style>
        /* تمام استایل‌ها مثل قبل */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0a0e17;
            min-height: 100vh;
            padding: 20px;
            color: #e8edf5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 10px;
        }
        h1 span {
            color: #00d4ff;
        }
        .sub {
            text-align: center;
            color: #8899bb;
            margin-bottom: 30px;
        }
        .card {
            background: rgba(18, 30, 51, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid #1e314a;
        }
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: end;
        }
        .form-row .field {
            flex: 1;
            min-width: 150px;
        }
        .form-row label {
            display: block;
            font-size: 13px;
            color: #b0c4e8;
            margin-bottom: 4px;
        }
        .form-row input,
        .form-row select {
            background: #0f1a2b;
            border: 1px solid #1e314a;
            border-radius: 10px;
            padding: 10px 14px;
            color: #e8edf5;
            width: 100%;
            outline: none;
            transition: 0.3s;
        }
        .form-row input:focus,
        .form-row select:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.15);
        }
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #0077b6);
            color: #fff;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.3);
        }
        .btn-secondary {
            background: #1e314a;
            color: #b0c4e8;
        }
        .btn-secondary:hover {
            background: #2a4060;
            color: #fff;
        }
        .btn-success {
            background: linear-gradient(135deg, #00d4aa, #00856a);
            color: #fff;
        }
        .btn-danger {
            background: #b02a37;
            color: #fff;
        }
        .btn-danger:hover {
            background: #c0392b;
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 13px;
        }
        .config-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .config-item {
            background: #0b121f;
            border-radius: 16px;
            padding: 18px;
            border: 1px solid #1a2a40;
            position: relative;
            transition: 0.3s;
        }
        .config-item:hover {
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.05);
        }
        .config-item .name {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .config-item .detail {
            font-size: 13px;
            color: #8899bb;
            margin-bottom: 4px;
        }
        .config-item .link-box {
            background: #050a12;
            border-radius: 8px;
            padding: 8px 10px;
            font-family: monospace;
            font-size: 11px;
            color: #a0c4e8;
            word-break: break-all;
            margin: 10px 0;
            border: 1px solid #1a2a40;
            max-height: 70px;
            overflow-y: auto;
            direction: ltr;
            text-align: left;
        }
        .config-item .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .qr-mini {
            display: inline-block;
            background: #fff;
            padding: 4px;
            border-radius: 8px;
            margin-top: 6px;
        }
        .badge {
            background: #1e314a;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 11px;
            color: #b0c4e8;
        }
        .badge-volume {
            background: #0077b6;
            color: #fff;
            font-weight: 600;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e314a;
            color: #fff;
            padding: 12px 28px;
            border-radius: 40px;
            border: 1px solid #00d4ff;
            opacity: 0;
            transition: 0.4s;
            z-index: 999;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
        }
        .empty-msg {
            text-align: center;
            color: #4a5f7a;
            padding: 50px 0;
        }
        .volume-select {
            min-width: 120px;
        }
        @media (max-width: 700px) {
            .config-list {
                grid-template-columns: 1fr;
            }
            .form-row .field {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📡 <span>چند کانفیگ</span> ویتوری</h1>
        <p class="sub">به همراه انتخاب حجم مصرفی — هر کانفیگ برای یک حجم مشخص</p>

        <!-- کارت تنظیمات اصلی -->
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:15px;">
                <h3 style="color:#b0c4e8;">⚙️ تنظیمات پایه</h3>
                <span style="color:#4a5f7a; font-size:13px;">تغییرات روی همه کانفیگ‌ها اعمال می‌شود</span>
            </div>
            <div class="form-row">
                <div class="field">
                    <label>🌐 آدرس سرور</label>
                    <input type="text" id="baseAddress" value="example.com">
                </div>
                <div class="field">
                    <label>🔌 پورت شروع</label>
                    <input type="number" id="basePort" value="443">
                </div>
                <div class="field">
                    <label>🛡️ پروتکل</label>
                    <select id="baseProtocol">
                        <option value="vless">VLESS</option>
                        <option value="vmess">VMess</option>
                        <option value="trojan">Trojan</option>
                        <option value="shadowsocks">Shadowsocks</option>
                    </select>
                </div>
                <div class="field">
                    <label>🌍 شبکه</label>
                    <select id="baseNetwork">
                        <option value="ws">WebSocket</option>
                        <option value="tcp">TCP</option>
                        <option value="grpc">gRPC</option>
                    </select>
                </div>
                <div class="field">
                    <label>🔐 TLS</label>
                    <select id="baseTls">
                        <option value="none">None</option>
                        <option value="tls">TLS</option>
                        <option value="reality">Reality</option>
                    </select>
                </div>
                <div class="field">
                    <label>📁 Path</label>
                    <input type="text" id="basePath" value="/">
                </div>
                <div class="field">
                    <label>🏷️ پیشوند نام</label>
                    <input type="text" id="baseName" value="Server">
                </div>
                <div class="field volume-select">
                    <label>📊 حجم (GB)</label>
                    <select id="baseVolume">
                        <option value="10">۱۰</option>
                        <option value="20">۲۰</option>
                        <option value="50" selected>۵۰</option>
                        <option value="100">۱۰۰</option>
                        <option value="200">۲۰۰</option>
                        <option value="0">نامحدود</option>
                    </select>
                </div>
                <!-- گزینه جدید: Encryption برای VLESS -->
                <div class="field" id="encryptionGroup">
                    <label>🔑 Encryption (VLESS)</label>
                    <select id="vlessEncryption">
                        <option value="none" selected>none (پیش‌فرض)</option>
                        <option value="auto">auto (برخی کلاینت‌ها)</option>
                    </select>
                </div>
            </div>
            <div style="margin-top:15px; display:flex; gap:10px; flex-wrap:wrap;">
                <button class="btn btn-primary" onclick="generateMultiple()">🚀 تولید ۵ کانفیگ</button>
                <button class="btn btn-secondary" onclick="generateMultiple(10)">🔢 تولید ۱۰ کانفیگ</button>
                <button class="btn btn-danger" onclick="clearAll()">🗑️ حذف همه</button>
                <button class="btn btn-secondary" onclick="saveConfigs()">💾 ذخیره در مرورگر</button>
                <button class="btn btn-secondary" onclick="loadConfigs()">📂 بارگذاری ذخیره‌شده</button>
            </div>
        </div>

        <!-- لیست کانفیگ‌ها -->
        <div id="configList" class="config-list">
            <div class="empty-msg">👆 کانفیگی ساخته نشده — دکمه تولید را بزنید</div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast">✅ انجام شد</div>

    <script>
        // ====== توابع کمکی ======
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._to);
            t._to = setTimeout(() => t.classList.remove('show'), 2500);
        }

        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0,
                    v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        function getBase() {
            return {
                address: document.getElementById('baseAddress').value || 'example.com',
                port: parseInt(document.getElementById('basePort').value) || 443,
                protocol: document.getElementById('baseProtocol').value,
                network: document.getElementById('baseNetwork').value,
                tls: document.getElementById('baseTls').value,
                path: document.getElementById('basePath').value || '/',
                namePrefix: document.getElementById('baseName').value || 'Server',
                volume: document.getElementById('baseVolume').value,
                encryption: document.getElementById('vlessEncryption').value // مقدار جدید
            };
        }

        // ====== تولید کانفیگ تکی ======
        function buildConfig(base, index) {
            const id = generateUUID();
            const port = base.port + index;
            const volume = base.volume === '0' ? 'Unlimited' : base.volume + 'GB';
            const name = `${base.namePrefix}-${index+1} (${volume})`;
            const host = base.address;
            const path = base.path === '/' ? '/' : base.path + (index + 1);

            let link = '';
            const p = base.protocol;

            if (p === 'vless') {
                let params = new URLSearchParams();
                // ===== اصلاح خطا =====
                params.set('encryption', base.encryption || 'none'); // استفاده از مقدار انتخاب‌شده
                if (base.tls !== 'none') params.set('security', base.tls);
                if (base.tls !== 'none') params.set('sni', host);
                params.set('host', host);
                if (path !== '/') params.set('path', path);
                params.set('type', base.network);
                params.set('flow', 'xtls-rprx-vision');
                params.set('fp', 'chrome');
                link = `vless://${id}@${host}:${port}?${params.toString()}#${encodeURIComponent(name)}`;
            } else if (p === 'vmess') {
                const obj = {
                    v: '2',
                    ps: name,
                    add: host,
                    port: port,
                    id: id,
                    aid: 0,
                    net: base.network,
                    type: 'none',
                    host: host,
                    path: path,
                    tls: base.tls === 'none' ? '' : base.tls,
                    scy: 'auto'
                };
                if (!obj.host) delete obj.host;
                if (obj.path === '/') delete obj.path;
                if (!obj.tls) delete obj.tls;
                const json = JSON.stringify(obj);
                const b64 = btoa(unescape(encodeURIComponent(json)));
                link = 'vmess://' + b64;
            } else if (p === 'trojan') {
                let params = new URLSearchParams();
                if (base.tls !== 'none') params.set('security', base.tls);
                params.set('sni', host);
                params.set('host', host);
                if (path !== '/') params.set('path', path);
                params.set('type', base.network);
                params.set('allowInsecure', '0');
                link =
                    `trojan://${id}@${host}:${port}?${params.toString()}#${encodeURIComponent(name)}`;
            } else if (p === 'shadowsocks') {
                const method = 'chacha20-ietf-poly1305';
                const user = `${method}:${id}`;
                const b64 = btoa(unescape(encodeURIComponent(user)));
                link = `ss://${b64}@${host}:${port}#${encodeURIComponent(name)}`;
            }

            return {
                id: id,
                name: name,
                address: host,
                port: port,
                protocol: p,
                network: base.network,
                tls: base.tls,
                path: path,
                volume: base.volume === '0' ? 'نامحدود' : base.volume + ' GB',
                link: link
            };
        }

        // ====== تولید چند کانفیگ ======
        function generateMultiple(count = 5) {
            const base = getBase();
            const configs = [];
            for (let i = 0; i < count; i++) {
                configs.push(buildConfig(base, i));
            }
            renderConfigs(configs);
            showToast(`✅ ${count} کانفیگ با حجم ${base.volume === '0' ? 'نامحدود' : base.volume + 'GB'} ساخته شد`);
            saveToLocal(configs);
        }

        // ====== رندر ======
        function renderConfigs(configs) {
            const container = document.getElementById('configList');
            if (!configs || configs.length === 0) {
                container.innerHTML = `<div class="empty-msg">📭 هیچ کانفیگی موجود نیست</div>`;
                return;
            }

            let html = '';
            configs.forEach((cfg, idx) => {
                const qrId = `qr-${idx}`;
                const volumeDisplay = cfg.volume || 'نامشخص';
                html += `
                <div class="config-item" data-idx="${idx}">
                    <div class="name">
                        <span>${cfg.name}</span>
                        <span class="badge badge-volume">📊 ${volumeDisplay}</span>
                    </div>
                    <div class="detail">📍 ${cfg.address}:${cfg.port} | ${cfg.network} | TLS: ${cfg.tls}</div>
                    <div class="link-box" id="link-${idx}">${cfg.link}</div>
                    <div class="actions">
                        <button class="btn btn-success btn-sm" onclick="copyLink(${idx})">📋 کپی</button>
                        <button class="btn btn-secondary btn-sm" onclick="showQR(${idx}, '${cfg.link}')">📱 QR</button>
                        <button class="btn btn-danger btn-sm" onclick="removeConfig(${idx})">✖</button>
                    </div>
                    <div id="${qrId}" class="qr-mini" style="display:none;"></div>
                </div>
                `;
            });
            container.innerHTML = html;
            window._configs = configs;
        }

        // ====== کپی لینک ======
        function copyLink(idx) {
            const cfg = window._configs[idx];
            if (!cfg) return;
            navigator.clipboard.writeText(cfg.link).then(() => {
                showToast('📋 کپی شد: ' + cfg.name);
            }).catch(() => {
                const el = document.getElementById(`link-${idx}`);
                if (el) {
                    const range = document.createRange();
                    range.selectNode(el);
                    window.getSelection().removeAllRanges();
                    window.getSelection().addRange(range);
                    document.execCommand('copy');
                    showToast('📋 کپی شد');
                }
            });
        }

        // ====== نمایش QR ======
        function showQR(idx, link) {
            const container = document.getElementById(`qr-${idx}`);
            if (!container) return;
            if (container.style.display === 'block') {
                container.style.display = 'none';
                container.innerHTML = '';
                return;
            }
            container.style.display = 'block';
            container.innerHTML = '';
            try {
                new QRCode(container, {
                    text: link,
                    width: 150,
                    height: 150,
                    colorDark: '#000',
                    colorLight: '#fff'
                });
            } catch (e) {
                container.innerHTML = '<span style="color:#ff6b6b;">خطا</span>';
            }
        }

        // ====== حذف یک کانفیگ ======
        function removeConfig(idx) {
            if (!window._configs) return;
            const newConfigs = window._configs.filter((_, i) => i !== idx);
            window._configs = newConfigs;
            renderConfigs(newConfigs);
            saveToLocal(newConfigs);
            showToast('🗑️ حذف شد');
        }

        // ====== پاک کردن همه ======
        function clearAll() {
            if (window._configs && window._configs.length > 0) {
                if (!confirm('همه کانفیگ‌ها پاک شوند؟')) return;
            }
            window._configs = [];
            renderConfigs([]);
            localStorage.removeItem('v2ray_configs');
            showToast('🗑️ همه پاک شد');
        }

        // ====== ذخیره و بارگذاری ======
        function saveToLocal(configs) {
            try {
                localStorage.setItem('v2ray_configs', JSON.stringify(configs));
            } catch (e) {}
        }

        function saveConfigs() {
            if (!window._configs || window._configs.length === 0) {
                showToast('⚠️ کانفیگی برای ذخیره وجود ندارد');
                return;
            }
            saveToLocal(window._configs);
            showToast('💾 در مرورگر ذخیره شد');
        }

        function loadConfigs() {
            try {
                const raw = localStorage.getItem('v2ray_configs');
                if (!raw) {
                    showToast('📂 داده ذخیره‌شده‌ای یافت نشد');
                    return;
                }
                const data = JSON.parse(raw);
                if (data.length === 0) {
                    showToast('📂 لیست خالی است');
                    return;
                }
                window._configs = data;
                renderConfigs(data);
                showToast(`📂 ${data.length} کانفیگ بارگذاری شد`);
            } catch (e) {
                showToast('❌ خطا در بارگذاری');
            }
        }

        // بارگذاری خودکار در شروع
        window.onload = function() {
            loadConfigs();
        };
    </script>

</body>
</html>
